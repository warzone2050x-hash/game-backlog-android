plugins {
    id 'com.android.application'
}
android {
    namespace 'com.pixel.empire1.gamebacklog'
    compileSdk 36
    defaultConfig {
        applicationId "com.pixel.empire1.gamebacklog"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.1"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
